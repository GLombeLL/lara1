<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Lara'nın Hikayesi — Caretta Caretta Takip</title>
  <style>
    html, body {
      padding: 0; margin: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a;
    }
    #viewDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .control-panel {
      position: absolute; top: 20px; left: 20px; z-index: 99;
      background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 20px; border-radius: 12px; width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); color: #e0e0e0;
    }
    .control-panel h2 { font-size: 15px; margin: 0 0 15px 0; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; }
    .row { display: flex; gap: 8px; margin-bottom: 14px; }
    button {
      flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: #1e1e1e; color: #e0e0e0; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    button.primary { background: #1C7293; border-color: #1C7293; }
    button:hover { opacity: 0.85; }
    .section-label { font-size: 11px; color: #8a8a8a; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 6px 0; }
    input[type=range] { width: 100%; cursor: pointer; }
    
    #storyText { font-size: 13px; margin-top: 8px; color: #38bdf8; font-weight: 500; min-height: 40px; line-height: 1.4; }
    #sourceText { font-size: 11px; margin-top: 6px; color: #6a6a6a; font-style: italic; }
    label.chk { font-size: 12px; color: #b0b0b0; display: flex; align-items: center; gap: 6px; margin-top: 10px; }

    /* Bitiş Kartı / Dokunaklı Modal */
    #endCard {
      position: absolute; bottom: 30px; right: 30px; z-index: 100;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px);
      border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 14px; width: 320px;
      padding: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); color: #f8fafc;
      display: none; animation: fadeIn 0.8s ease forwards;
    }
    #endCard img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
    #endCard h3 { font-size: 14px; color: #f87171; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    #endCard p { font-size: 12.5px; line-height: 1.5; color: #cbd5e1; margin: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

  <div class="control-panel">
    <h2>Lara'nın Rotası</h2>

    <div class="row">
      <button id="playBtn" class="primary">▶ Oynat</button>
      <button id="resetBtn">↺ Başa Sar</button>
    </div>

    <div class="section-label">Yolculuk Durumu</div>
    <input type="range" id="scrubSlider" min="1" max="100" value="1" step="1">
    <div id="storyText">Yolculuk başlamaya hazırlanıyor...</div>
    <div id="sourceText">GPS sinyalleri senkronize ediliyor.</div>

    <label class="chk"><input type="checkbox" id="followCam" checked> Kamera rotayı takip etsin</label>
  </div>

  <!-- Dokunaklı Bitiş Kartı -->
  <div id="endCard">
    <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?q=80&w=600&auto=format&fit=crop" alt="Caretta Caretta">
    <h3>Koruma Altında Bir Yaşam</h3>
    <p>Lara bugün hayatta, ama yavruları onun kadar şanslı olacak mı? Kumsallardaki ışık kirliliği ve plastikler yolculuklarını tehdit ediyor. Lara yardımlarınıza muhtaç.</p>
  </div>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebMap",
      "esri/views/MapView",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/Polyline",
      "esri/geometry/Point",
      "esri/geometry/support/webMercatorUtils"
    ], function(WebMap, MapView, GraphicsLayer, Graphic, Polyline, Point, webMercatorUtils) {

      const WEBMAP_PORTAL_ITEM_ID = "607a12960a1e43b3b00446344406380c";
      const STEP_MS = 45;

      const webmap = new WebMap({
        portalItem: { id: WEBMAP_PORTAL_ITEM_ID },
        basemap: "streets-navigation-vector"
      });

      const view = new MapView({
        container: "viewDiv",
        map: webmap
      });

      const animLayer = new GraphicsLayer();
      webmap.add(animLayer);

      const playBtn = document.getElementById("playBtn");
      const resetBtn = document.getElementById("resetBtn");
      const scrub = document.getElementById("scrubSlider");
      const storyText = document.getElementById("storyText");
      const sourceText = document.getElementById("sourceText");
      const followCam = document.getElementById("followCam");
      const endCard = document.getElementById("endCard");

      let fullPath = null;
      const spatialRef = { wkid: 3857 };
      let timer = null;
      let isPlaying = false;

      let activeLineGraphic = null;
      let activePointGraphic = null;

      function densifyPath(path, subdivisions = 8) {
        const dense = [];
        for (let i = 0; i < path.length - 1; i++) {
          const p1 = path[i];
          const p2 = path[i + 1];
          for (let j = 0; j < subdivisions; j++) {
            const t = j / subdivisions;
            const x = p1[0] + (p2[0] - p1[0]) * t;
            const y = p1[1] + (p2[1] - p1[1]) * t;
            dense.push([x, y]);
          }
        }
        dense.path = path[path.length - 1]; // koruma
        dense.push(path[path.length - 1]);
        return dense;
      }

      view.when(async () => {
        try {
          await webmap.loadAll();
          
          let routeLayer = null;
          for (let layer of webmap.allLayers) {
            if (layer.type === "feature") {
              await layer.load();
              if (layer.geometryType === "polyline") {
                routeLayer = layer;
                break;
              }
            }
          }

          if (!routeLayer) {
            sourceText.textContent = "⚠️ Haritada polyline katmanı bulunamadı.";
            return;
          }

          const q = routeLayer.createQuery();
          q.where = "1=1";
          q.returnGeometry = true;
          q.outSpatialReference = { wkid: 4326 };

          const result = await routeLayer.queryFeatures(q);
          if (result.features.length === 0) {
            sourceText.textContent = "⚠️ Katman verisi boş.";
            return;
          }

          routeLayer.visible = false; 
          const geom = result.features[0].geometry;
          
          const rawReversed = geom.paths[0].reverse();

          const convertedPath = rawReversed.map(coord => {
            const pt = new Point({ x: coord[0], y: coord[1], spatialReference: { wkid: 4326 } });
            const wm = webMercatorUtils.geographicToWebMercator(pt);
            return [wm.x, wm.y];
          });

          fullPath = densifyPath(convertedPath, 8); 

          sourceText.textContent = "GPS Verisi Aktif • Canlı İzleme";
          storyText.textContent = "Lara Akdeniz'in sakin sularında yüzüyor...";

          scrub.max = fullPath.length;
          scrub.value = 1;
          
          const lineGeom = new Polyline({ paths: [fullPath], spatialReference: spatialRef });
          await view.goTo(lineGeom.extent.expand(1.8), { animate: false });

          initGraphics();
          drawUpTo(1, false);

          scrub.addEventListener("input", () => {
            stopPlaying();
            endCard.style.display = "none";
            drawUpTo(parseInt(scrub.value), false);
          });

          playBtn.addEventListener("click", () => {
            if (isPlaying) { stopPlaying(); return; }
            startPlaying();
          });

          resetBtn.addEventListener("click", () => {
            stopPlaying();
            endCard.style.display = "none";
            scrub.value = 1;
            drawUpTo(1, true);
            view.goTo(lineGeom.extent.expand(1.8), { animate: true, duration: 600 });
          });

        } catch (err) {
          console.error(err);
          sourceText.textContent = "⚠️ Harita yüklenirken hata oluştu.";
        }
      });

      function initGraphics() {
        animLayer.removeAll();
        
        activeLineGraphic = new Graphic({
          geometry: new Polyline({ paths: [[]], spatialReference: spatialRef }),
          symbol: { type: "simple-line", color: [14, 165, 233, 0.95], width: 4 }
        });

        activePointGraphic = new Graphic({
          geometry: new Point({ x: 0, y: 0, spatialReference: spatialRef }),
          symbol: {
            type: "simple-marker",
            style: "circle",
            color: [239, 68, 68, 1],
            size: 10,
            outline: { color: [255, 255, 255, 1], width: 2 }
          }
        });

        animLayer.addMany([activeLineGraphic, activePointGraphic]);
      }

      function updateStoryMessage(index, total) {
        const ratio = index / total;
        if (ratio < 0.25) {
          storyText.textContent = "Lara Akdeniz'in masmavi sularında serbestçe yüzüyor 🌊";
        } else if (ratio < 0.55) {
          storyText.textContent = "Kıyı şeridi boyunca beslenmek için ilerliyor 🐢";
        } else if (ratio < 0.85) {
          storyText.textContent = "Güvenli yuvalama alanlarına doğru süzülüyor...";
        } else if (ratio < 1) {
          storyText.textContent = "Rotanın sonuna yaklaşılıyor, yolculuk tamamlanmak üzere...";
        } else {
          storyText.textContent = "Lara güvenli noktaya ulaştı. 🌿";
          endCard.style.display = "block"; // Dokunaklı kartı göster
        }
      }

      function drawUpTo(index, animateCamera = true) {
        if (!fullPath || index < 1) return;

        scrub.value = index;
        updateStoryMessage(index, fullPath.length);

        const partial = fullPath.slice(0, index);
        activeLineGraphic.geometry = new Polyline({ paths: [partial], spatialReference: spatialRef });

        const tip = partial[partial.length - 1];
        if (tip) {
          const tipPoint = new Point({ x: tip[0], y: tip[1], spatialReference: spatialRef });
          activePointGraphic.geometry = tipPoint;

          if (followCam.checked && isPlaying && animateCamera) {
            view.center = tipPoint;
            if (view.zoom !== 12.5) {
              view.zoom = 12.5;
            }
          }
        }
      }

      function startPlaying() {
        if (parseInt(scrub.value) >= fullPath.length) {
          scrub.value = 1;
          endCard.style.display = "none";
        }
        isPlaying = true;
        playBtn.textContent = "⏸ Durdur";
        let idx = parseInt(scrub.value);
        
        timer = setInterval(() => {
          idx++;
          if (idx > fullPath.length) { 
            stopPlaying(); 
            return; 
          }
          drawUpTo(idx, true);
        }, STEP_MS);
      }

      function stopPlaying() {
        isPlaying = false;
        playBtn.textContent = "▶ Oynat";
        if (timer) clearInterval(timer);
        timer = null;
      }

    });
  </script>
</body>
</html>

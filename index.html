<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Lara'nın Rotası — Kümülatif Animasyon</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; font-family:'Segoe UI',Tahoma,sans-serif; background:#1e1e1e; color:#e0e0e0; overflow:hidden; }
    #viewDiv { width:100%; height:100%; position:absolute; }
    .control-panel {
      position:absolute; top:20px; left:20px; z-index:99;
      background:rgba(18,18,18,0.92); backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.15); padding:20px; border-radius:12px; width:340px;
      box-shadow:0 10px 30px rgba(0,0,0,0.7);
    }
    .control-panel h2 { font-size:15px; margin:0 0 15px 0; color:#4CAF50; text-transform:uppercase; letter-spacing:1px; }
    .row { display:flex; gap:8px; margin-bottom:14px; }
    button {
      flex:1; padding:9px 0; border-radius:8px; border:1px solid rgba(255,255,255,0.2);
      background:#1e1e1e; color:#e0e0e0; font-size:13px; font-weight:700; cursor:pointer;
    }
    button.primary { background:#1C7293; border-color:#1C7293; }
    button:hover { opacity:0.85; }
    .section-label { font-size:11px; color:#8a8a8a; text-transform:uppercase; letter-spacing:1px; margin:10px 0 6px 0; }
    input[type=range] { width:100%; cursor:pointer; }
    #progressText { font-size:13px; margin-top:6px; color:#b0b0b0; }
    #sourceText { font-size:11px; margin-top:4px; color:#6a6a6a; font-style:italic; }
    label.chk { font-size:12px; color:#b0b0b0; display:flex; align-items:center; gap:6px; margin-top:10px; }
  </style>
  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark-red/main.css" />
  <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

  <div class="control-panel">
    <h2>Lara'nın Rotası</h2>

    <div class="row">
      <button id="playBtn" class="primary">▶ Oynat</button>
      <button id="resetBtn">↺ Başa Sar</button>
    </div>

    <div class="section-label">İlerleme</div>
    <input type="range" id="scrubSlider" min="1" max="122" value="1" step="1">
    <div id="progressText">Nokta 1 / 122</div>
    <div id="sourceText">Bağlantı kuruluyor…</div>

    <label class="chk"><input type="checkbox" id="followCam" checked> Kamera rotayı takip etsin</label>
  </div>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/Polyline"
    ], function(Map, MapView, FeatureLayer, GraphicsLayer, Graphic, Polyline) {

      // =====================================================================
      // AYARLAR (Doğrudan Feature Layer Servis URL'nizi buraya yazın)
      // =====================================================================
      const FEATURE_LAYER_URL = "https://services.arcgis.com/.../arcgis/rest/services/.../FeatureServer/0"; // Veya katman servis linkiniz
      const STEP_MS = 120;             
      const FOLLOW_ZOOM = 13;          
      const TURTLE_EMOJI = "🐢";
      const TURTLE_SIZE = 22;
      // =====================================================================

      // Eğer servis URL'si yerine doğrudan WebMap kullanmak istiyorsak güvenli bir basemap ile başlatıyoruz:
      const map = new Map({
        basemap: "dark-gray-vector"
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [30.0, 36.5], // Akdeniz / Antalya civarı
        zoom: 8
      });

      const animLayer = new GraphicsLayer();
      map.add(animLayer);

      const playBtn = document.getElementById("playBtn");
      const resetBtn = document.getElementById("resetBtn");
      const scrub = document.getElementById("scrubSlider");
      const progressText = document.getElementById("progressText");
      const sourceText = document.getElementById("sourceText");
      const followCam = document.getElementById("followCam");

      let fullPath = null;   
      let spatialRef = null;
      let timer = null;
      let isPlaying = false;

      // Harita açıldığında veriyi doğrudan Rest Servisinden çekelim
      view.when(async () => {
        try {
          // Senin polyline katmanının Rest URL'sini buraya ekleyebilirsin veya webmap item id kullanabilirsin
          // Alternatif olarak AGOL Webmap'ten yüklemek için:
          sourceText.textContent = "Rotaya bağlanıldı.";
          
          // Test amaçlı örnek polyline simülasyon verisi (Eğer servis linki bekleniyorsa)
          // Verini doğrudan buraya bağlayacağız:
        } catch (err) {
          sourceText.textContent = "⚠️ Veri yüklenemedi.";
          console.error(err);
        }
      });

    });
  </script>
</body>
</html>
